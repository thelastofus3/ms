server:
  port: 8003
  tomcat:
    connection-timeout: 60s
  forward-headers-strategy: framework
  error:
    include-message: never
room:
  auth:
    trusted-proxies: ${ROOM_AUTH_TRUSTED_PROXIES:}
spring:
  datasource:
    url: ${ROOM_DATABASE_URL:jdbc:postgresql://localhost:15433/rooms}
    username: ${ROOM_DATABASE_USER:rooms}
    password: ${ROOM_DATABASE_PASSWORD:rooms-local}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
