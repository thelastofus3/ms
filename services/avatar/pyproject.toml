[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-room-avatar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "pydantic>=2,<3", "python-multipart>=0.0.18", "pillow>=11", "jsonschema>=4"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28", "httpx2"]

[project.scripts]
avatar = "avatar_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
