server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 128m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz { access_log off; return 200 'ok'; }
    location ~ ^/v1/rooms/uploads/[0-9A-Fa-f-]+/files/[0-9]+(?:/parts/[0-9]+)?$ {
        client_max_body_size 16m;
        client_body_timeout 30s;
        set $room_api http://room-api:8003;
        proxy_pass $room_api$request_uri;
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Room-Client-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }
    location /v1/rooms {
        set $room_api http://room-api:8003;
        proxy_pass $room_api$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Room-Client-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_read_timeout 120s;
    }
    # Walk-around videos for avatars: up to 1 GB, streamed to the photo service without buffering.
    location = /v1/photo-captures/video {
        client_max_body_size 1100m;
        client_body_timeout 120s;
        set $photo_api http://avatar-photos:8002;
        proxy_pass $photo_api$request_uri;
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Room-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location /v1/photo-captures {
        set $photo_api http://avatar-photos:8002;
        proxy_pass $photo_api$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Room-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_read_timeout 120s;
    }
    location /v1/ { return 404; }
    # Hashed bundles never change; a missing one must be a 404, not index.html (a stale tab would load HTML as JS).
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    # Models/WASM keep fixed names across versions: revalidate, and never fall back to HTML for a missing model.
    location /tracking/ { try_files $uri =404; add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
